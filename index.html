<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模拟消息发送</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222d;
      --line: #2a3544;
      --text: #e7edf5;
      --muted: #8b9bb0;
      --accent: #3d9cf0;
      --ok: #3ecf8e;
      --err: #f07178;
      --warn: #e6b450;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2a3d 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #182433 0%, transparent 50%),
        var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .panel {
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    @media (max-width: 720px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    .stat {
      background: #121821;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 6px;
    }

    .stat .value {
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    button:hover:not(:disabled) { opacity: 0.92; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.secondary {
      background: #2b3645;
      color: var(--text);
    }

    button.danger { background: #b84b55; }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .progress {
      margin-top: 14px;
      height: 8px;
      background: #121821;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2f7fd0, #3ecf8e);
      transition: width 0.25s ease;
    }

    .log-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .log-head h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }

    #log {
      max-height: 480px;
      overflow: auto;
      font-family: ui-monospace, Consolas, "Courier New", monospace;
      font-size: 0.8rem;
      line-height: 1.45;
      background: #121821;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }

    .log-item {
      padding: 8px 0;
      border-bottom: 1px solid #243041;
    }

    .log-item:last-child { border-bottom: 0; }

    .tag {
      display: inline-block;
      min-width: 48px;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 0.72rem;
      margin-right: 6px;
    }

    .tag.ok { background: rgba(62, 207, 142, 0.18); color: var(--ok); }
    .tag.err { background: rgba(240, 113, 120, 0.18); color: var(--err); }
    .tag.info { background: rgba(61, 156, 240, 0.18); color: var(--accent); }
    .tag.wait { background: rgba(230, 180, 80, 0.18); color: var(--warn); }

    .muted { color: var(--muted); }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      align-items: end;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .field input,
    .field select {
      width: 140px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #121821;
      color: var(--text);
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      outline: none;
    }

    .field select { width: 170px; cursor: pointer; }

    .field select.send-mode { width: 150px; }

    .field.hidden { display: none; }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
    }

    .field input:disabled,
    .field select:disabled {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>模拟消息发送</h1>
    
    <div class="panel">
      <div class="stats">
        <div class="stat">
          <div class="label">总数</div>
          <div class="value" id="total">-</div>
        </div>
        <div class="stat">
          <div class="label">已发送</div>
          <div class="value" id="sent">0</div>
        </div>
        <div class="stat">
          <div class="label">状态</div>
          <div class="value" id="status">未开始</div>
        </div>
        <div class="stat">
          <div class="label">下次等待</div>
          <div class="value" id="nextWait">-</div>
        </div>
      </div>

      <div class="config-row">
        <div class="field">
          <label for="modelFile">数据文件</label>
          <select id="modelFile"></select>
        </div>
        <div class="field">
          <label for="talkListFile">聊天记录文件</label>
          <select id="talkListFile"></select>
        </div>
        <div class="field">
          <label for="maxDelaySec">最大间隔（秒）</label>
          <input id="maxDelaySec" type="number" min="1" step="1" value="1" />
        </div>
        <div class="field">
          <label for="sendMode">消息发送模式</label>
          <select id="sendMode" class="send-mode">
            <option value="single">单句发送</option>
            <option value="dialogue">对话拼接发送</option>
            <option value="interval">固定时间间隔</option>
          </select>
        </div>
        <div class="field hidden" id="mergeIntervalField">
          <label for="mergeIntervalSec">拼接间隔（秒）</label>
          <input id="mergeIntervalSec" type="number" min="1" step="1" value="30" />
        </div>
        <button id="btnReloadModel" class="secondary" type="button">重新加载</button>
        <span class="hint">切换文件后会重新加载；运行中不可切换</span>
      </div>

      <div class="actions" style="margin-top: 16px;">
        <button id="btnStart">开始发送</button>
        <button id="btnPause" class="secondary" disabled>暂停</button>
        <button id="btnStop" class="danger" disabled>停止并重置</button>
        <button id="btnSave" class="secondary" type="button">保存结果</button>
        <span class="hint" id="loadHint">正在加载 model.json…</span>
      </div>
      <div class="progress"><i id="bar"></i></div>
    </div>

    <div class="panel">
      <div class="log-head">
        <h2>运行日志</h2>
        <button id="btnClearLog" class="secondary" type="button">清空日志</button>
      </div>
      <div id="log"></div>
    </div>
  </div>

  <script src="./node_modules/xlsx/xlsx.js"></script>
  <script>
    const API_URL = "http://test-lhw-dify.ydtg.com.cn/v1/workflows/run";
    const API_KEY = "app-Qwp0qBULTAFuVuGSry86I2NR";
    const FIXED_NAME = "张三丰";
    const FIXED_USER = "user-abc-123";
    // 延迟请求时长 s
    const DEFAULT_MAX_DELAY_SEC = 1;
    /** 固定时间间隔模式下，消息合并的默认阈值（秒） */
    const DEFAULT_MERGE_INTERVAL_SEC = 30;
    /** 模拟数据文件（用户话术） */
    const MODEL_FILES = [
      "model.json",
      "model2.json",
      "model04.json",
      "model05.json",
      "model06.json",
      "model07.json",
      "model08.json",
    ];
    /** 聊天记录文件（含 type 的完整对话） */
    const TALK_LIST_FILES = [
      "talkList.json",
      "talkList2.json",
      "talkList04.json",
      "talkList05.json",
      "talkList06.json",
      "talkList07.json",
      "talkList08.json",
    ];

    const DEFAULT_CHAT_ID = "6a4c8ac67dad3f2469625443";

    function getQueryParam(name) {
      return new URLSearchParams(location.search).get(name);
    }

    function getChatId() {
      const fromRoute = (getQueryParam("chatId") || "").trim();
      return fromRoute || DEFAULT_CHAT_ID;
    }

    const el = {
      total: document.getElementById("total"),
      sent: document.getElementById("sent"),
      status: document.getElementById("status"),
      nextWait: document.getElementById("nextWait"),
      bar: document.getElementById("bar"),
      log: document.getElementById("log"),
      loadHint: document.getElementById("loadHint"),
      btnStart: document.getElementById("btnStart"),
      btnPause: document.getElementById("btnPause"),
      btnStop: document.getElementById("btnStop"),
      btnClearLog: document.getElementById("btnClearLog"),
      btnReloadModel: document.getElementById("btnReloadModel"),
      btnSave: document.getElementById("btnSave"),
      maxDelaySec: document.getElementById("maxDelaySec"),
      sendMode: document.getElementById("sendMode"),
      mergeIntervalSec: document.getElementById("mergeIntervalSec"),
      mergeIntervalField: document.getElementById("mergeIntervalField"),
      modelFile: document.getElementById("modelFile"),
      talkListFile: document.getElementById("talkListFile"),
    };

    function fillSelect(selectEl, files) {
      selectEl.innerHTML = files.map((f, i) =>
        `<option value="${f}"${i === 0 ? " selected" : ""}>${f}</option>`
      ).join("");
    }

    // 之后只需改 MODEL_FILES / TALK_LIST_FILES 两处列表
    fillSelect(el.modelFile, MODEL_FILES);
    fillSelect(el.talkListFile, TALK_LIST_FILES);

    let messages = [];
    /** 当前选中的 talkList 全量记录（含 type），发送时附带上文 */
    let talkListAll = [];
    /** talkList 顺序游标：下一次查找的起始下标（只向后找，避免重复 text 命中第一条） */
    let talkCursor = 0;
    /** 本轮 SEND + OK 结果，用于导出 Excel */
    let sessionRecords = [];
    let index = 0;
    let sentCount = 0;
    let running = false;
    let paused = false;
    let stopping = false;
    /** 当前进行中的 sendOne Promise，停止时需等待其结束 */
    let sendInFlight = null;
    let timerId = null;
    let countdownId = null;
    let waitUntil = 0;

    function resetTalkCursor() {
      talkCursor = 0;
    }

    function parseTime(str) {
      // "2026-06-17 20:16:41" -> local Date
      return new Date(String(str).replace(" ", "T"));
    }

    function getMaxDelayMs() {
      const sec = Number(el.maxDelaySec.value);
      if (!Number.isFinite(sec) || sec < 1) return DEFAULT_MAX_DELAY_SEC * 1000;
      return Math.floor(sec) * 1000;
    }

    /** 相邻两条：差 ≤最大间隔用实际差，超过则封顶；第一条立即发 */
    function getDelayMs(prevItem, currItem) {
      if (!prevItem) return 0;
      const prev = parseTime(prevItem.time).getTime();
      const curr = parseTime(currItem.time).getTime();
      if (Number.isNaN(prev) || Number.isNaN(curr)) return 0;
      const diff = Math.max(0, curr - prev);
      return Math.min(diff, getMaxDelayMs());
    }

    function formatMs(ms) {
      if (ms <= 0) return "立即";
      const s = Math.ceil(ms / 1000);
      if (s < 60) return `${s} 秒`;
      const m = Math.floor(s / 60);
      const r = s % 60;
      return r ? `${m} 分 ${r} 秒` : `${m} 分`;
    }

    function setStatus(text) {
      el.status.textContent = text;
    }

    function updateProgress() {
      el.sent.textContent = String(sentCount);
      const pct = messages.length ? (sentCount / messages.length) * 100 : 0;
      el.bar.style.width = `${pct}%`;
    }

    function getSendMode() {
      const v = String(el.sendMode.value || "single");
      if (v === "dialogue" || v === "interval") return v;
      return "single";
    }

    function getMergeIntervalSec() {
      const sec = Number(el.mergeIntervalSec.value);
      if (!Number.isFinite(sec) || sec < 1) return DEFAULT_MERGE_INTERVAL_SEC;
      return Math.floor(sec);
    }

    function syncMergeIntervalVisibility() {
      const show = getSendMode() === "interval";
      el.mergeIntervalField.classList.toggle("hidden", !show);
    }

    /**
     * 按发送模式解析一批待发送消息。
     * @returns {{ items: object[], query: string, first: object, last: object }}
     */
    function resolveSendBatch(startIndex) {
      const first = messages[startIndex];
      if (!first) {
        return { items: [], query: "", first: null, last: null };
      }

      const mode = getSendMode();

      if (mode === "dialogue") {
        syncTalkCursor(startIndex);
        const idx = locateUserTalkIndex(first, talkCursor);
        let talkGroup = [first];
        if (idx >= 0) {
          talkGroup = [talkListAll[idx]];
          for (let i = idx + 1; i < talkListAll.length; i++) {
            const t = talkListAll[i];
            if (t.type !== 1) break;
            talkGroup.push(t);
          }
        }
        // 按 talkList 连续用户句的条数，顺序吃掉 model 中同样数量的用户句
        // （避免仅靠 text+time 键在时间漂移时拼不动）
        const items = [];
        for (let i = 0; i < talkGroup.length && startIndex + i < messages.length; i++) {
          items.push(messages[startIndex + i]);
        }
        if (!items.length) items.push(first);
        const query = talkGroup.map((t) => String(t.text || "")).join(" ");
        const last = items[items.length - 1];
        return { items, query, first: items[0], last };
      }

      if (mode === "interval") {
        const thresholdMs = getMergeIntervalSec() * 1000;
        const items = [first];
        for (let i = startIndex + 1; i < messages.length; i++) {
          const prev = items[items.length - 1];
          const next = messages[i];
          const prevT = parseTime(prev.time).getTime();
          const nextT = parseTime(next.time).getTime();
          if (Number.isNaN(prevT) || Number.isNaN(nextT)) break;
          if (nextT - prevT < thresholdMs) items.push(next);
          else break;
        }
        const query = items.map((m) => String(m.text || "")).join(" ");
        return { items, query, first: items[0], last: items[items.length - 1] };
      }

      // single
      return {
        items: [first],
        query: String(first.text || ""),
        first,
        last: first,
      };
    }

    function sendModeLabel(mode) {
      if (mode === "dialogue") return "对话拼接";
      if (mode === "interval") return "固定间隔";
      return "单句";
    }

    function log(tag, cls, html) {
      const item = document.createElement("div");
      item.className = "log-item";
      item.innerHTML = `<span class="tag ${cls}">${tag}</span>${html}`;
      el.log.prepend(item);
    }

    function clearTimers() {
      if (timerId) {
        clearTimeout(timerId);
        timerId = null;
      }
      if (countdownId) {
        clearInterval(countdownId);
        countdownId = null;
      }
      waitUntil = 0;
      el.nextWait.textContent = "-";
    }

    function startCountdown(delayMs) {
      waitUntil = Date.now() + delayMs;
      const tick = () => {
        const left = Math.max(0, waitUntil - Date.now());
        el.nextWait.textContent = formatMs(left);
        if (left <= 0 && countdownId) {
          clearInterval(countdownId);
          countdownId = null;
        }
      };
      tick();
      countdownId = setInterval(tick, 200);
    }

    /** talkList 请求最多携带的上文条数 */
    const TALK_LIST_LIMIT = 30;

    /**
     * 从 fromIdx 起向后找下一条用户消息。
     * 优先 text+time 精确匹配；找不到再按 text 顺序匹配（应对重复句 / 时间漂移）。
     */
    function locateUserTalkIndex(item, fromIdx) {
      if (!talkListAll.length || !item) return -1;
      const text = item.text;
      const time = item.time == null ? "" : String(item.time);
      const start = Math.max(0, fromIdx | 0);
      let textFallback = -1;
      for (let i = start; i < talkListAll.length; i++) {
        const t = talkListAll[i];
        if (t.type !== 1 || t.text !== text) continue;
        if (String(t.time || "") === time) return i;
        if (textFallback < 0) textFallback = i;
      }
      return textFallback;
    }

    /** 将游标同步到 messages[0..msgIndex) 已消费完的位置 */
    function syncTalkCursor(msgIndex) {
      talkCursor = 0;
      const n = Math.max(0, Math.min(msgIndex | 0, messages.length));
      for (let i = 0; i < n; i++) {
        const idx = locateUserTalkIndex(messages[i], talkCursor);
        if (idx < 0) return;
        talkCursor = idx + 1;
      }
    }

    /**
     * 从当前 talkCursor 起，按 batch.items 顺序定位 talkList 下标。
     * @returns {{ firstIdx: number, lastIdx: number, nextCursor: number } | null}
     */
    function locateBatchTalkIndices(batch) {
      if (!batch || !batch.items || !batch.items.length) return null;
      let cursor = talkCursor;
      let firstIdx = -1;
      let lastIdx = -1;
      for (const item of batch.items) {
        const idx = locateUserTalkIndex(item, cursor);
        if (idx < 0) return null;
        if (firstIdx < 0) firstIdx = idx;
        lastIdx = idx;
        cursor = idx + 1;
      }
      return { firstIdx, lastIdx, nextCursor: cursor };
    }

    /** 取 talkList[talkIdx] 之前最近的记录（最多 TALK_LIST_LIMIT 条） */
    function getTalkListBeforeAt(talkIdx) {
      if (talkIdx < 0) return [];
      const before = talkListAll.slice(0, talkIdx);
      return before.length > TALK_LIST_LIMIT
        ? before.slice(-TALK_LIST_LIMIT)
        : before;
    }

    /** 取 talkList[talkIdx] 之后连续的 type===2 客服回复 */
    function getHumanRepliesAfterAt(talkIdx) {
      if (talkIdx < 0) return "";
      const replies = [];
      for (let i = talkIdx + 1; i < talkListAll.length; i++) {
        const t = talkListAll[i];
        if (t.type === 1) break;
        if (t.type === 2 && t.text) replies.push(String(t.text));
      }
      return replies.join("\n");
    }

    function formatHistoryLine(t) {
      const role = t.type === 1 ? "用户" : "客服";
      return `[${t.time}][${role}] text: ${t.text}`;
    }

    function buildConversationHistory(list) {
      return list.map(formatHistoryLine).join("\n");
    }

    /** 从 blocking 响应中取 data.outputs.text_out */
    function extractReplyText(raw) {
      try {
        const obj = JSON.parse(raw);
        const textOut = obj && obj.data && obj.data.outputs && obj.data.outputs.text_out;
        if (typeof textOut === "string") return textOut;
      } catch (_) { /* not JSON */ }
      return "";
    }

    /** 去掉 &lt;text&gt; 等标签，只保留纯文本 */
    function stripHtmlTags(s) {
      const str = String(s || "");
      const parts = [];
      const re = /<text>([\s\S]*?)<\/text>/gi;
      let m;
      while ((m = re.exec(str))) {
        const t = m[1].trim();
        if (t) parts.push(t);
      }
      if (parts.length) return parts.join(" ");
      return str.replace(/<[^>]+>/g, "").trim();
    }

    /** talkList 对话时间 → 导出格式：2026/6/16 20:44 */
    function formatTalkTime(timeStr) {
      const d = parseTime(timeStr);
      if (Number.isNaN(d.getTime())) return String(timeStr || "");
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const h = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${y}/${m}/${day} ${h}:${min}`;
    }

    function buildExportRows() {
      const header = ["时间", "用户问题", "AI回复", "销售真人回复", "AI回的好还是坏"];
      const rows = sessionRecords.map((r) => [
        r.time || "",
        r.user || "",
        r.reply || "-",
        r.humanReply || "-",
        "",
      ]);
      return [header, ...rows];
    }

    function saveResults({ auto = false } = {}) {
      if (!sessionRecords.length) {
        log("INFO", "info", auto ? "无可保存结果，跳过自动保存" : "暂无 SEND/OK 结果可保存");
        return false;
      }
      if (typeof XLSX === "undefined") {
        log("ERR", "err", "未加载 xlsx 库，无法导出 Excel");
        return false;
      }
      const aoa = buildExportRows();
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "结果");
      const ts = new Date()
        .toISOString()
        .replace(/[:.]/g, "-")
        .slice(0, 19);
      const filename = `send-results-${ts}.xlsx`;
      XLSX.writeFile(wb, filename);
      log(
        "INFO",
        "info",
        `${auto ? "自动" : "手动"}保存 ${sessionRecords.length} 条 → ${escapeHtml(filename)}`
      );
      return true;
    }

    async function sendOne(batch) {
      // 按 model 进度同步游标，再顺序定位本批在 talkList 中的位置
      syncTalkCursor(index);
      const located = locateBatchTalkIndices(batch);
      const historyList = located
        ? getTalkListBeforeAt(located.firstIdx)
        : [];
      const conversationHistory = buildConversationHistory(historyList);
      if (located) talkCursor = located.nextCursor;

      const body = {
        inputs: {
          type: "text",
          name: FIXED_NAME,
          query: batch.query,
          conversation_history: conversationHistory,
        },
        response_mode: "blocking",
        user: FIXED_USER,
        files: [],
        trace_id: "",
      };

      const mode = getSendMode();
      const mergeHint =
        batch.items.length > 1
          ? ` · ${sendModeLabel(mode)} ${batch.items.length} 条`
          : ` · ${sendModeLabel(mode)}`;
      const historyHint = located
        ? ` · history=${historyList.length} 条 · talk#${located.firstIdx}`
        : ` · history=0 条 · talk未命中`;

      log(
        "SEND",
        "info",
        `<span class="muted">#${index + 1}</span> ${escapeHtml(batch.query)}${mergeHint} <span class="muted">· user=${FIXED_USER} · name=${FIXED_NAME}${historyHint}</span>`
      );

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${API_KEY}`,
          },
          body: JSON.stringify(body),
        });
        const text = await res.text();
        const replyRaw = extractReplyText(text);
        const reply = stripHtmlTags(replyRaw);

        if (!res.ok) {
          const errPreview = reply || text.slice(0, 300);
          log("ERR", "err", `HTTP ${res.status} · ${escapeHtml(errPreview)}`);
          return false;
        }
        log("OK", "ok", escapeHtml(reply || "(空回复)"));
        sessionRecords.push({
          time: formatTalkTime(batch.first.time),
          user: batch.query,
          reply: reply || "",
          humanReply: located
            ? getHumanRepliesAfterAt(located.lastIdx)
            : "",
        });
        return true;
      } catch (err) {
        log(
          "ERR",
          "err",
          `${escapeHtml(err.message || String(err))} <span class="muted">（若浏览器报 CORS，需后端放行或用本地代理）</span>`
        );
        return false;
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function scheduleNext() {
      if (!running || paused) return;

      if (index >= messages.length) {
        running = false;
        clearTimers();
        setStatus("已完成");
        el.btnStart.disabled = false;
        el.btnPause.disabled = true;
        el.btnStop.disabled = true;
        el.btnPause.textContent = "暂停";
        log("DONE", "ok", `全部 ${messages.length} 条已处理完毕`);
        saveResults({ auto: true });
        return;
      }

      const batch = resolveSendBatch(index);
      const prev = index > 0 ? messages[index - 1] : null;
      const curr = batch.first;
      const delay = getDelayMs(prev, curr);

      if (delay > 0) {
        const rawDiff = prev
          ? Math.max(0, parseTime(curr.time) - parseTime(prev.time))
          : 0;
        const maxDelayMs = getMaxDelayMs();
        const capped = rawDiff > maxDelayMs;
        const batchHint =
          batch.items.length > 1
            ? `（合并 ${batch.items.length} 条）`
            : "";
        // log(
        //   "WAIT",
        //   "wait",
        //   `等待 ${formatMs(delay)} 后发送第 ${index + 1} 条${batchHint}` +
        //     (capped
        //       ? ` <span class="muted">（原始间隔 ${formatMs(rawDiff)}，已封顶 ${formatMs(maxDelayMs)}）</span>`
        //       : ` <span class="muted">（按原始间隔）</span>`)
        // );
        setStatus("等待中");
        startCountdown(delay);
      } else {
        el.nextWait.textContent = "立即";
        setStatus("发送中");
      }

      timerId = setTimeout(async () => {
        if (!running || paused || stopping) return;
        clearInterval(countdownId);
        countdownId = null;
        el.nextWait.textContent = "-";
        setStatus("发送中");

        sendInFlight = sendOne(batch);
        try {
          await sendInFlight;
        } finally {
          sendInFlight = null;
        }

        if (stopping) return;

        index += batch.items.length;
        sentCount = index;
        updateProgress();
        if (!running || paused) return;
        scheduleNext();
      }, delay);
    }

    function getModelFile() {
      const name = String(el.modelFile.value || "").trim();
      if (MODEL_FILES.includes(name)) return name;
      return MODEL_FILES[0];
    }

    function getTalkListFile() {
      const name = String(el.talkListFile.value || "").trim();
      if (TALK_LIST_FILES.includes(name)) return name;
      return TALK_LIST_FILES[0];
    }

    function updateLoadHint() {
      const modelFile = getModelFile();
      const talkFile = getTalkListFile();
      el.loadHint.textContent =
        `数据 ${modelFile}（${messages.length}）· 聊天记录 ${talkFile}（${talkListAll.length}）`;
    }

    function resetProgress() {
      index = 0;
      sentCount = 0;
      resetTalkCursor();
      updateProgress();
    }

    function setRunningUi(isRunning) {
      el.btnStart.disabled = isRunning;
      el.btnPause.disabled = !isRunning;
      el.btnStop.disabled = !isRunning;
      const lockConfig = isRunning && !paused;
      el.maxDelaySec.disabled = lockConfig;
      el.sendMode.disabled = lockConfig;
      el.mergeIntervalSec.disabled = lockConfig;
      el.modelFile.disabled = lockConfig;
      el.talkListFile.disabled = lockConfig;
      el.btnReloadModel.disabled = lockConfig;
    }

    async function loadTalkList() {
      const file = getTalkListFile();
      try {
        const res = await fetch(`./${file}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`加载 ${file} 失败: HTTP ${res.status}`);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error(`${file} 格式应为数组`);
        talkListAll = data;
        resetTalkCursor();
        log("INFO", "info", `${file} 加载成功，共 ${talkListAll.length} 条`);
        updateLoadHint();
        return true;
      } catch (err) {
        talkListAll = [];
        resetTalkCursor();
        updateLoadHint();
        log("ERR", "err", escapeHtml(err.message || String(err)));
        return false;
      }
    }

    async function loadModel({ reset = true } = {}) {
      const file = getModelFile();
      el.loadHint.textContent = `正在加载 ${file}…`;
      el.btnStart.disabled = true;
      try {
        const res = await fetch(`./${file}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`加载 ${file} 失败: HTTP ${res.status}`);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error(`${file} 格式应为数组`);
        messages = data;
        if (reset) resetProgress();
        el.total.textContent = String(messages.length);
        el.btnStart.disabled = running;
        log("INFO", "info", `${file} 加载成功，共 ${messages.length} 条`);
        updateLoadHint();
        return true;
      } catch (err) {
        messages = [];
        el.total.textContent = "0";
        el.loadHint.textContent = `${file} 加载失败`;
        el.btnStart.disabled = true;
        log("ERR", "err", escapeHtml(err.message || String(err)));
        return false;
      }
    }

    async function reloadAll({ reset = true } = {}) {
      await Promise.all([loadTalkList(), loadModel({ reset })]);
    }

    el.btnStart.addEventListener("click", () => {
      if (!messages.length) {
        log("ERR", "err", `${getModelFile()} 无数据`);
        return;
      }
      if (paused && running) {
        paused = false;
        el.btnPause.textContent = "暂停";
        setStatus("继续中");
        setRunningUi(true);
        scheduleNext();
        return;
      }
      if (index >= messages.length) {
        index = 0;
        sentCount = 0;
        updateProgress();
      }
      // 新开一轮（非继续暂停）时清空本轮结果
      if (index === 0 && sentCount === 0) {
        sessionRecords = [];
        resetTalkCursor();
      }
      running = true;
      paused = false;
      stopping = false;
      setRunningUi(true);
      el.btnPause.textContent = "暂停";
      setStatus("运行中");
      const mode = getSendMode();
      const modeExtra =
        mode === "interval" ? ` · 拼接间隔=${getMergeIntervalSec()}s` : "";
      log(
        "INFO",
        "info",
        `开始从第 ${index + 1} 条发送，共 ${messages.length} 条 · 模式=${sendModeLabel(mode)}${modeExtra} · chatId=${getChatId()}`
      );
      scheduleNext();
    });

    el.btnPause.addEventListener("click", () => {
      if (!running) return;
      paused = true;
      clearTimers();
      setStatus("已暂停");
      el.btnStart.disabled = false;
      el.btnPause.disabled = true;
      el.btnPause.textContent = "暂停";
      el.maxDelaySec.disabled = false;
      el.sendMode.disabled = false;
      el.mergeIntervalSec.disabled = false;
      el.modelFile.disabled = false;
      el.talkListFile.disabled = false;
      el.btnReloadModel.disabled = false;
      log("INFO", "info", `已暂停，当前位置第 ${index + 1} 条`);
    });

    function finishStop() {
      saveResults({ auto: true });
      index = 0;
      sentCount = 0;
      resetTalkCursor();
      updateProgress();
      stopping = false;
      setStatus("已停止");
      setRunningUi(false);
      el.btnPause.textContent = "暂停";
      el.log.innerHTML = "";
      log("INFO", "info", "已停止并重置进度");
    }

    el.btnStop.addEventListener("click", async () => {
      if (stopping) return;
      stopping = true;
      running = false;
      paused = false;
      clearTimers();
      el.btnStop.disabled = true;
      el.btnPause.disabled = true;
      el.btnStart.disabled = true;

      if (sendInFlight) {
        setStatus("停止中…");
        log("INFO", "info", "等待当前接口响应结束后停止…");
        try {
          await sendInFlight;
        } catch (_) { /* ignore */ }
      }

      finishStop();
    });

        el.btnSave.addEventListener("click", () => {
        saveResults({ auto: false });
        });

    el.btnClearLog.addEventListener("click", () => {
      el.log.innerHTML = "";
    });

    el.btnReloadModel.addEventListener("click", () => {
      if (running && !paused) return;
      reloadAll({ reset: true });
    });

    el.modelFile.addEventListener("change", () => {
      if (running && !paused) return;
      loadModel({ reset: true });
    });

    el.talkListFile.addEventListener("change", () => {
      if (running && !paused) return;
      loadTalkList();
    });

    el.sendMode.addEventListener("change", () => {
      syncMergeIntervalVisibility();
    });

    syncMergeIntervalVisibility();
    reloadAll({ reset: true });
  </script>
</body>
</html>
